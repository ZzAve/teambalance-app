<!doctype html><html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: {{width}}px; height: {{height}}px; background: transparent; overflow: hidden; }
text { font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-weight: 600; fill: #1E293B; }
</style></head><body>
<!-- A phone around the take: opaque everywhere except the screen window the recording shows through.
     The status bar and home strips are drawn in the app's header colour, so the recording joins them. -->
<svg xmlns="http://www.w3.org/2000/svg" width="{{width}}" height="{{height}}" viewBox="0 0 {{width}} {{height}}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243B5E"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <mask id="hole"><rect width="{{width}}" height="{{height}}" fill="#fff"/><rect x="{{sx}}" y="{{sy}}" width="{{sw}}" height="{{sh}}" rx="{{r}}" fill="#000"/></mask>
    <clipPath id="screen"><rect x="{{sx}}" y="{{sy}}" width="{{sw}}" height="{{sh}}" rx="{{r}}"/></clipPath>
  </defs>
  <rect width="{{width}}" height="{{height}}" fill="url(#bg)" mask="url(#hole)"/>
  <ellipse cx="{{cx}}" cy="{{height}}" rx="900" ry="420" fill="rgba(0,0,0,.35)" mask="url(#hole)"/>
  <rect x="{{bx}}" y="{{by}}" width="{{bw}}" height="{{bh}}" rx="{{br}}" fill="#0B0F1A" mask="url(#hole)"/>
  <rect x="{{bx}}" y="{{by}}" width="{{bw}}" height="{{bh}}" rx="{{br}}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="3" mask="url(#hole)"/>
  <rect x="{{btnL}}" y="700" width="10" height="110" rx="4" fill="#161B27"/>
  <rect x="{{btnL}}" y="880" width="10" height="200" rx="4" fill="#161B27"/>
  <rect x="{{btnL}}" y="1120" width="10" height="200" rx="4" fill="#161B27"/>
  <rect x="{{btnR}}" y="940" width="10" height="320" rx="4" fill="#161B27"/>
  <g clip-path="url(#screen)">
    <rect x="{{sx}}" y="{{sy}}" width="{{sw}}" height="{{status}}" fill="#FDFCF9"/>
    <rect x="{{sx}}" y="{{homeY}}" width="{{sw}}" height="{{home}}" fill="#FDFCF9"/>
  </g>
  <rect x="{{homeBarX}}" y="{{homeBarY}}" width="340" height="12" rx="6" fill="#1E293B"/>
  <rect x="{{islandX}}" y="{{islandY}}" width="300" height="88" rx="44" fill="#000"/>
  <text x="{{timeX}}" y="{{textY}}" font-size="44" text-anchor="middle">9:41</text>
  <g transform="translate({{iconsX}} {{iconsY}})" fill="#1E293B">
    <rect x="0" y="20" width="9" height="12" rx="2"/><rect x="14" y="14" width="9" height="18" rx="2"/><rect x="28" y="8" width="9" height="24" rx="2"/><rect x="42" y="2" width="9" height="30" rx="2"/>
    <path d="M86 12a32 32 0 0 0-44 0l6 6a24 24 0 0 1 32 0z M74 22a20 20 0 0 0-20 0l5 5a12 12 0 0 1 10 0z M64 32l-4-4a6 6 0 0 1 8 0z"/>
    <rect x="104" y="4" width="62" height="30" rx="9" fill="none" stroke="#1E293B" stroke-opacity=".4" stroke-width="3"/>
    <rect x="108" y="8" width="54" height="22" rx="6"/><rect x="168" y="13" width="5" height="12" rx="2" fill-opacity=".4"/>
  </g>
</svg>
</body></html>
