name: Setup toolchain
description: Java, Node and Gradle setup, plus the Wirespec TypeScript client and npm dependencies.

inputs:
  wirespec:
    description: Generate the Wirespec TypeScript client (./gradlew :api:wirespec-typescript).
    default: 'true'
  npm-ci:
    description: Run npm ci in app/.
    default: 'true'
  playwright:
    description: Install headless Chromium and its system libraries for Playwright / Vitest browser mode.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '25.0.4+7.0.LTS'

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: app/package-lock.json

    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    # The SPA and Storybook import the Wirespec-generated TS client (gitignored, emitted by
    # Gradle into app/src/shared/api/generated); generate it before any Vite build.
    - name: Generate Wirespec TypeScript client
      if: ${{ inputs.wirespec == 'true' }}
      shell: bash
      run: ./gradlew :api:wirespec-typescript

    - name: Install dependencies
      if: ${{ inputs.npm-ci == 'true' }}
      shell: bash
      run: npm ci
      working-directory: app

    # The Chromium binary only changes when Playwright's version does, so cache
    # ~/.cache/ms-playwright keyed on the lockfile. On a hit we skip the (slow)
    # browser download and only re-run install-deps, which installs the apt
    # system libraries that live outside the cached directory.
    - name: Cache Playwright browsers
      if: ${{ inputs.playwright == 'true' }}
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

    - name: Install Playwright browser (+ system deps)
      if: ${{ inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: npx playwright install --with-deps chromium
      working-directory: app

    - name: Install Playwright system deps (cached browser)
      if: ${{ inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: npx playwright install-deps chromium
      working-directory: app
