name: Chromatic

# Visual-regression gate (ADR-0017). Publishes the Storybook build to Chromatic, which
# renders every story on its own fixed infra and diffs against the accepted baseline.
#
# How this gates automerge (deliberately — see ADR-0017):
#   - The job runs with exitZeroOnChanges, so a visual delta does NOT fail *this* job.
#   - Instead, Chromatic posts a "UI Tests" commit status that stays pending/failed until a
#     human accepts the diff in the Chromatic UI. Mark **UI Tests** as a required status
#     check in branch protection — that is what blocks a Renovate automerge on any pixel
#     change. There is no autoAcceptChanges on PR branches: a delta always needs a human.
#   - On push to main the accepted PR snapshots are promoted to the baseline automatically
#     by Chromatic's git integration; we do not auto-accept here.
#
# Requires the CHROMATIC_PROJECT_TOKEN repo secret (create the Chromatic project first).

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'design-tokens/**'
  # No paths filter on PRs — the workflow must always run so the required "UI Tests" /
  # "chromatic" checks always report. A path-skipped workflow emits no check-run at all, which
  # a required status check reads as "waiting" forever, blocking backend-only and Renovate PRs
  # (the exact automerge case ADR-0017 targets). TurboSnap (onlyChanged) keeps a no-app-change
  # run at 0 snapshots — free and auto-green — so always running costs nothing when nothing moved.
  #
  # ready_for_review is added to the default types so leaving draft re-runs Chromatic: the Run
  # Chromatic step skips the snapshot upload while the PR is a draft (see `skip:` below), so a
  # non-draft run must fire when the PR becomes reviewable to lay down the real snapshots.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Collapse a burst of rapid pushes to the same PR into a single run: a newer commit cancels the
# older in-progress/queued run before it reaches the Chromatic step, so WIP iteration snapshots the
# latest state once instead of every intermediate push. Keyed by ref, so distinct PRs never cancel
# each other. main is deliberately excluded from cancellation — the newest main commit defines the
# baseline, so every merge to main must run to completion and promote its snapshots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  chromatic:
    # Fork PRs run without secrets, so the project token is absent — skip rather than fail red.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic needs full git history to find each commit's baseline and to run
          # TurboSnap (onlyChanged) — a shallow clone breaks baseline detection.
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Stories transitively import the Wirespec-generated TS client (gitignored); generate it
      # before the Storybook build, exactly like storybook.yml, or Vite fails on missing modules.
      - name: Generate Wirespec TypeScript client
        run: ./gradlew :api:wirespec-typescript

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Run Chromatic
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        with:
          workingDir: app
          onlyChanged: true
          exitZeroOnChanges: true
          exitOnceUploaded: true
          # Draft PRs are work-in-progress and can't merge, so their WIP pushes shouldn't spend the
          # monthly snapshot budget. On a skip Chromatic uploads nothing (0 snapshots) yet still posts
          # a passing "UI Tests"/"chromatic" status, so the required checks keep reporting rather than
          # hang as "waiting". Marking the PR ready fires ready_for_review (see the trigger above),
          # which re-runs this with skip=false to lay down the real snapshots and gate the merge. On
          # push to main github.event.pull_request is null, so skip is empty/falsy and main always runs.
          skip: ${{ github.event.pull_request.draft }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
