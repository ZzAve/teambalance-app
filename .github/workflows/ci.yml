name: CI

on:
  push:
    branches: [main, 'deploy*', 'deploy/**']
  pull_request:

permissions:
  contents: read

# Deploy-only config (the `build` job ignores it). See docs/ops/deploy.md. The container's
# cpu/memory/sandbox are managed manually in the Scaleway console, not here.
env:
  SCW_DEFAULT_REGION: fr-par
  REGISTRY: rg.fr-par.scw.cloud/teambalance
  CONTAINER_ID: ec9dfda3-65ca-4901-a640-895fd2f9f5f3
  DEMO_CONTAINER_ID: 26261720-f1a3-4b35-930b-bf960855a360
  S3_ENDPOINT: https://s3.fr-par.scw.cloud
  SPA_BUCKET: teambalance-spa
  WWW_BUCKET: teambalance-www
  SPA_PIPELINE: f6b8a00d-9a40-4ceb-8d94-82d9383a7515
  WWW_PIPELINE: 881dea79-6072-449a-99dd-75c019db3c79

jobs:
  # The three test layers run as parallel jobs; `build` waits for all of them. Each job has its
  # own runner, so each pays its own setup (~1 min) but the wall clock becomes the slowest layer
  # (the backend tests) instead of their sum.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          wirespec: false
          npm-ci: false

      # `build -x test` compiles, runs detekt and processAot; the Testcontainers ITs start their
      # own Postgres, so this job needs no service container.
      - run: ./gradlew build -x test
      - run: make test-api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          playwright: true

      - run: npm run lint
        working-directory: app
      - run: npm run build
        working-directory: app

      - run: make test-www

      # Frontend tests (Vitest: jsdom units + headless-Chromium Storybook project).
      #
      # Vitest's browser-mode project intermittently fails to tear down its headless
      # Chromium after an otherwise-passing run: every test reports ✓, but the browser
      # (and its esbuild/provider handles) never close, so the Node process never exits
      # and the step hangs until the job's hard limit. It's a shutdown race, not a test
      # failure — the assertions have already passed when it wedges.
      #
      # Bound each attempt with a wall-clock timeout so a wedged run is killed in minutes
      # instead of hours, and retry once so the intermittent teardown flake self-heals.
      # A genuine test failure exits non-zero fast and fails both attempts, so this masks
      # only the browser-close hang, not real breakage. A healthy run is ~2 min.
      - name: Frontend tests (Vitest)
        working-directory: app
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=30s --signal=TERM 10m npm test; then
              exit 0
            fi
            echo "::warning::vitest did not exit cleanly (attempt ${attempt}/2) — likely the headless-browser teardown hang; retrying"
          done
          echo "::error::vitest failed on both attempts"
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teambalance
          POSTGRES_PASSWORD: teambalance
          POSTGRES_DB: teambalance_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U teambalance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          playwright: true

      # Real full-stack e2e: backend via bootRun (e2e profile) against the job's Postgres
      # service container, health-gated by scripts/e2e.sh.
      - name: Real full-stack e2e
        run: make e2e

      - name: Upload backend e2e log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-e2e-log
          path: /tmp/teambalance-e2e-backend.log
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7

  # `build` is the required status check and the deploy jobs' gate. `always()` keeps it from
  # being skipped when a test job fails — a skipped required check counts as passing.
  build:
    needs: [api, frontend, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'

  # Editing an already-merged migration breaks its frozen Flyway checksum and fails validation on boot.
  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Migrations are append-only
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # No usable baseline (e.g. a branch's first push): nothing to diff against, so pass.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against — skipping append-only check."
            exit 0
          fi
          changed="$(git diff --diff-filter=MDR --name-only "$base" HEAD -- \
            'api/src/main/resources/db/migration' \
            'api/src/main/resources/db/tenant-migration')"
          if [ -n "$changed" ]; then
            echo "::error::Applied Flyway migrations were modified/deleted/renamed — migrations are append-only."
            echo "Offending files:"
            echo "$changed" | sed 's/^/  - /'
            echo "Fix: revert the change to these files. Correct docs in the ADR, and make schema changes in a NEW migration."
            exit 1
          fi
          echo "✓ No already-merged migration files were modified."

  # Builds and pushes the prod, stg and demo API images on every run (PRs too), so deploy-stg.yml can put any branch or
  # PR on stg and a prod deploy ships the exact image that was built here. The targets share every
  # stage but the last. ubuntu-latest is amd64, so --platform=linux/amd64 is native. GIT_SHA is baked
  # into the image and surfaced on /internal/actuator/info so the deploy jobs can confirm which image
  # is serving.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The demo target copies app/dist-demo (.dockerignore allow-lists it); make demo-spa generates the
      # Wirespec client itself, so the toolchain step skips it.
      - uses: ./.github/actions/setup-toolchain
        with:
          wirespec: false

      - run: make demo-spa

      # On a PR, GITHUB_SHA is the temporary merge commit. The stg image also gets a `head-<sha>` tag
      # for the branch head, which is what deploy-stg.yml looks it up by.
      - name: Resolve image tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_SHA::12}" >> "$GITHUB_OUTPUT"

      # A buildx builder, because the default docker driver cannot export with rewrite-timestamp.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${REGISTRY%%/*}" -u nologin --password-stdin

      # Every timestamp in the image is clamped to 1980-02-01 (the date Spring Boot gives the extracted
      # jars), so the dependency layer (lib/) keeps the same digest across builds and the registry
      # stores it once. See the build stage in api/Dockerfile for why the date must not be later.
      - name: Build and push API images (prod + stg + demo, linux/amd64)
        env:
          SOURCE_DATE_EPOCH: "318211200"
        run: |
          for target in prod stg demo; do
            names="${REGISTRY}/api:${{ steps.tag.outputs.sha }}"
            [ "$target" = stg ] && names="${REGISTRY}/api-stg:${{ steps.tag.outputs.sha }},${REGISTRY}/api-stg:head-${{ steps.tag.outputs.head }}"
            [ "$target" = demo ] && names="${REGISTRY}/api-demo:${{ steps.tag.outputs.sha }}"
            docker buildx build --platform=linux/amd64 -f api/Dockerfile --target "$target" \
              --build-arg GIT_SHA="${{ steps.tag.outputs.sha }}" \
              --output "type=image,\"name=${names}\",push=true,rewrite-timestamp=true" .
          done

  # MANUAL deploy gate: runs only on push to `main`/`deploy*`, after `build`; each pauses for
  # approval via the `production` environment. Deploys the exact commit CI validated (tag = SHA).
  #
  # The wait for approval sits in its own tiny `approve-*` job, separate from the `deploy-*` job
  # that does the work. That split is what makes a stale gate harmless: `approve-*` is
  # `cancel-in-progress: true`, so a newer push to `main` cancels a still-unapproved gate from an
  # older commit and immediately asks for approval on the new one — no manual reject needed. The
  # `deploy-*` jobs only ever start once approved and stay `cancel-in-progress: false`, so a
  # rollout that is already under way is never interrupted; a second approved deploy queues behind
  # it. API and frontend keep their own gate, so they are still approved independently.
  approve-api:
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-prod-api-approval
      cancel-in-progress: true
    steps:
      - run: echo "Production ${GITHUB_SHA::12} approved — starting the api rollout."

  deploy-api:
    needs: [approve-api, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-prod-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          version: v2.58.3
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      # Image-only update: env/secret maps and the container's cpu/memory/sandbox config are left
      # untouched — those are managed manually in the Scaleway console.
      - name: Update Serverless Container image
        run: scw container container update "$CONTAINER_ID" image="${REGISTRY}/api:${{ needs.image.outputs.sha }}" region="$SCW_DEFAULT_REGION"

      - name: Verify the new image is actually serving
        run: ./.github/scripts/await-live-sha.sh https://api.teambalance.nl "${{ needs.image.outputs.sha }}"
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

      # Demo (ADR-0043): same commit, deployed after prod so a bad image never reaches the demo
      # first. The container scales to zero; the verify's first request wakes it (about 50 s).
      - name: Update demo Serverless Container image
        run: scw container container update "$DEMO_CONTAINER_ID" image="${REGISTRY}/api-demo:${{ needs.image.outputs.sha }}" region="$SCW_DEFAULT_REGION"

      - name: Verify the demo image is actually serving
        run: ./.github/scripts/await-live-sha.sh https://demo.teambalance.nl "${{ needs.image.outputs.sha }}"
        env:
          INTERNAL_API_KEY: ${{ secrets.DEMO_INTERNAL_API_KEY }}

  approve-frontend:
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-prod-frontend-approval
      cancel-in-progress: true
    steps:
      - run: echo "Production ${GITHUB_SHA::12} approved — starting the frontend rollout."

  deploy-frontend:
    needs: approve-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-prod-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      # `vite build` runs in production mode and auto-loads app/.env.production
      # (VITE_API_URL=https://api.teambalance.nl).
      - name: Build SPA
        run: npm run build
        working-directory: app

      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          version: v2.58.3
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Sync SPA + landing to Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          set -euo pipefail
          # SPA: content-hashed assets are immutable; index.html must never cache.
          # --delete removed on purpose: a client still on the previous shell (a long-open tab,
          # the installed PWA, or a stale SW) keeps referencing the last deploy's hashed chunks —
          # pruning them the instant a new deploy lands 404s those clients into a blank screen.
          # Hashes are content-addressed + immutable, so re-uploading unchanged hashes is a
          # harmless no-op and stale hashes never collide; reclaiming space is handed to a bucket
          # lifecycle rule (expire assets/ 90 days after last-modified — see docs/ops/deploy.md).
          aws --endpoint-url "$S3_ENDPOINT" s3 sync app/dist/assets "s3://${SPA_BUCKET}/assets" \
            --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp app/dist/index.html "s3://${SPA_BUCKET}/index.html" \
            --cache-control no-cache
          # PWA shell (F2): icons, master SVG and the hashed workbox runtime live at the bucket
          # root, next to index.html — they are not under assets/, so they need their own sync.
          # No --delete here: the root also holds index.html, which is uploaded separately.
          aws --endpoint-url "$S3_ENDPOINT" s3 sync app/dist "s3://${SPA_BUCKET}" \
            --exclude "assets/*" --exclude "index.html" \
            --exclude "sw.js" --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=86400"
          # The service worker and the manifest must never be cached: a stale sw.js pins every
          # installed client to the previous deploy's precache. Registration is now bundled into the
          # app entry (vite-plugin-pwa injectRegister: null), so there is no separate registerSW.js
          # to upload — the SW is emitted, self-registered by a hashed app chunk, nothing else.
          aws --endpoint-url "$S3_ENDPOINT" s3 cp app/dist/sw.js "s3://${SPA_BUCKET}/sw.js" \
            --cache-control no-cache
          # .webmanifest is not in the AWS CLI's mime table, so it would land as
          # application/octet-stream and be rejected as a manifest — set the type explicitly.
          aws --endpoint-url "$S3_ENDPOINT" s3 cp app/dist/manifest.webmanifest "s3://${SPA_BUCKET}/manifest.webmanifest" \
            --cache-control no-cache --content-type application/manifest+json
          # Landing page (#464, #152): Dutch at /, English at /en/, plus privacy pages, stylesheet,
          # script, fonts and images, all built into www/dist. Only www/dist is uploaded, so
          # nothing else under www/ can reach the bucket. No --delete (same reasoning as the SPA
          # block); the bucket root holds nothing else.
          node www/build.mjs
          # Fonts and images are unhashed but change rarely: a day at the edge, revalidated after.
          aws --endpoint-url "$S3_ENDPOINT" s3 sync www/dist "s3://${WWW_BUCKET}" \
            --exclude "*" --include "fonts/*" --include "*.png" --include "*.svg" --include "*.ico" \
            --cache-control "public,max-age=86400"
          # HTML, CSS and JS are unhashed and reference each other by name: no-cache makes them
          # revalidate together, so a fresh page never runs against a stale stylesheet or script.
          aws --endpoint-url "$S3_ENDPOINT" s3 sync www/dist "s3://${WWW_BUCKET}" \
            --exclude "fonts/*" --exclude "*.png" --exclude "*.svg" --exclude "*.ico" \
            --cache-control no-cache

      - name: Purge Edge Services cache
        run: |
          # A silently-skipped purge lets the edge keep serving a stale index.html that points at
          # pruned chunks. set -euo pipefail (matching the sync step) makes a failed purge fail the
          # job — explicit, and robust to any repo-level default-shell override that drops -e.
          set -euo pipefail
          scw edge-services purge-request create pipeline-id="$SPA_PIPELINE" all=true
          scw edge-services purge-request create pipeline-id="$WWW_PIPELINE" all=true
