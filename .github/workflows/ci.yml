name: CI

on:
  push:
    branches: [main, 'deploy*', 'deploy/**']
  pull_request:

permissions:
  contents: read

# Deploy-only config (the `build` job ignores it). Cold-start levers asserted on every deploy — see
# docs/plans/2026-07-24-startup-time-optimization.md and docs/ops/deploy.md.
env:
  SCW_REGION: fr-par
  REGISTRY: rg.fr-par.scw.cloud/teambalance
  CONTAINER_ID: ec9dfda3-65ca-4901-a640-895fd2f9f5f3
  # scw CLI v2.58.3 arg names: mvcpu-limit (mvCPU; 2000 = 2 vCPU) and memory-limit-bytes (a whole-GB
  # size STRING despite the name, e.g. 2GB). 2 vCPU speeds the CPU-bound cold start; sandbox v2
  # (gVisor) cuts it further.
  CONTAINER_MVCPU_LIMIT: '2000'
  CONTAINER_MEMORY_LIMIT: '2GB'
  CONTAINER_SANDBOX: v2
  S3_ENDPOINT: https://s3.fr-par.scw.cloud
  SPA_BUCKET: teambalance-spa
  WWW_BUCKET: teambalance-www
  SPA_PIPELINE: f6b8a00d-9a40-4ceb-8d94-82d9383a7515
  WWW_PIPELINE: 881dea79-6072-449a-99dd-75c019db3c79

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teambalance
          POSTGRES_PASSWORD: teambalance
          POSTGRES_DB: teambalance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U teambalance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - run: make ci
      - run: make lint

      # Needed before `make test`: the Storybook stories run in a headless-chromium
      # Vitest browser project, and the real e2e suite also drives Chromium.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: app

      - run: make test

      # Real full-stack e2e last (slowest layer): backend via bootRun (e2e profile) against the
      # workflow's Postgres service container, health-gated by scripts/e2e.sh.
      - name: Real full-stack e2e
        run: make e2e

      - name: Upload backend e2e log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: /tmp/teambalance-e2e-backend.log
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7

  # ===========================================================================
  # MANUAL deploy gate (replaces the old .github/workflows/deploy.yml).
  #
  # Runs ONLY on a push to `main` or a `deploy*` branch, ONLY after `build` is green, and each job
  # PAUSES for a one-click manual approval via the `production` GitHub Environment. It deploys the
  # exact commit CI just validated (image tag = commit SHA).
  #
  # ⚠️ REQUIRED ONE-TIME SETUP — the manual gate IS the environment protection, not the YAML:
  #   Settings → Environments → New environment `production` → add a *Required reviewer*.
  #   (Optionally restrict "Deployment branches" to `main` + `deploy*`.)
  #   WITHOUT a required reviewer these jobs run immediately with NO gate — i.e. every push to main
  #   would auto-deploy. Configure it before relying on this.
  # ===========================================================================
  deploy-api:
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy')) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          echo "image=${REGISTRY}/api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${REGISTRY}/api:${GITHUB_SHA::12}"

      # ubuntu-latest is amd64, so --platform=linux/amd64 is native (no emulation). The Gradle build
      # (buildSrc + Java 25 toolchain) runs INSIDE the multi-stage image, so the runner needs no setup.
      - name: Build API image (linux/amd64)
        run: docker build --platform=linux/amd64 -f api/Dockerfile -t "${{ steps.tag.outputs.image }}" .

      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          version: v2.58.3
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Push image to Container Registry
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${REGISTRY%%/*}" -u nologin --password-stdin
          docker push "${{ steps.tag.outputs.image }}"

      # Image update FIRST and alone, so it can never be blocked by a bad resource value below.
      # Env/secret maps are not passed, so they stay as-is.
      - name: Update Serverless Container image
        run: scw container container update "$CONTAINER_ID" image="${{ steps.tag.outputs.image }}" region="$SCW_REGION"

      # Resource + sandbox config in a SEPARATE update. If mvcpu/memory isn't a valid Scaleway pair
      # this step fails, but the new image is already live (previous step), so it's a one-value fix +
      # re-run. Arg names are for scw CLI v2.58.3: `mvcpu-limit` (mvCPU) and `memory-limit-bytes`
      # (a whole-GB size string despite the name, e.g. 2GB).
      - name: Assert Serverless Container resources + sandbox
        run: |
          scw container container update "$CONTAINER_ID" \
            mvcpu-limit="$CONTAINER_MVCPU_LIMIT" \
            memory-limit-bytes="$CONTAINER_MEMORY_LIMIT" \
            sandbox="$CONTAINER_SANDBOX" \
            region="$SCW_REGION"

  deploy-frontend:
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy')) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      # The SPA imports the Wirespec-generated TS client (gitignored, emitted by Gradle into
      # app/src/shared/api/generated). Generate it before the vite build or it fails on missing modules.
      - name: Generate Wirespec TypeScript client
        run: ./gradlew :api:wirespec-typescript

      # `vite build` runs in production mode and auto-loads app/.env.production
      # (VITE_API_URL=https://api.teambalance.nl).
      - name: Build SPA
        run: |
          npm ci
          npm run build
        working-directory: app

      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          version: v2.58.3
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Sync SPA + landing to Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          set -euo pipefail
          # SPA: content-hashed assets are immutable + pruned; index.html must never cache.
          aws --endpoint-url "$S3_ENDPOINT" s3 sync app/dist/assets "s3://${SPA_BUCKET}/assets" \
            --cache-control "public,max-age=31536000,immutable" --delete
          aws --endpoint-url "$S3_ENDPOINT" s3 cp app/dist/index.html "s3://${SPA_BUCKET}/index.html" \
            --cache-control no-cache
          # Landing page: index.html + style.css at root, tokens.css under /design-tokens/.
          aws --endpoint-url "$S3_ENDPOINT" s3 cp www/index.html "s3://${WWW_BUCKET}/index.html" \
            --cache-control no-cache
          aws --endpoint-url "$S3_ENDPOINT" s3 cp www/style.css "s3://${WWW_BUCKET}/style.css"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp design-tokens/tokens.css "s3://${WWW_BUCKET}/design-tokens/tokens.css"

      - name: Purge Edge Services cache
        run: |
          scw edge-services purge-request create pipeline-id="$SPA_PIPELINE" all=true
          scw edge-services purge-request create pipeline-id="$WWW_PIPELINE" all=true
