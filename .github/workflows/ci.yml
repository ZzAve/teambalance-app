name: CI

on:
  push:
    branches: [main, 'deploy*', 'deploy/**']
  pull_request:

permissions:
  contents: read

# Deploy-only config (the `build` job ignores it). See docs/ops/deploy.md. The container's
# cpu/memory/sandbox are managed manually in the Scaleway console, not here.
env:
  SCW_REGION: fr-par
  REGISTRY: rg.fr-par.scw.cloud/teambalance
  CONTAINER_ID: ec9dfda3-65ca-4901-a640-895fd2f9f5f3
  S3_ENDPOINT: https://s3.fr-par.scw.cloud
  SPA_BUCKET: teambalance-spa
  WWW_BUCKET: teambalance-www
  SPA_PIPELINE: f6b8a00d-9a40-4ceb-8d94-82d9383a7515
  WWW_PIPELINE: 881dea79-6072-449a-99dd-75c019db3c79

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step fails fast instead of running to GitHub's 6-hour
    # default. A healthy build (incl. e2e) finishes in well under 15 min; 30 is
    # generous headroom while still turning a hang into quick, actionable feedback.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teambalance
          POSTGRES_PASSWORD: teambalance
          POSTGRES_DB: teambalance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U teambalance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - run: make ci
      - run: make lint

      # Needed before `make test`: the Storybook stories run in a headless-chromium
      # Vitest browser project, and the real e2e suite also drives Chromium.
      #
      # The Chromium binary only changes when Playwright's version does, so cache
      # ~/.cache/ms-playwright keyed on the lockfile. On a hit we skip the (slow)
      # browser download and only re-run install-deps, which installs the apt
      # system libraries that live outside the cached directory.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright browser (+ system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: app

      - run: make test-api

      # Frontend tests (Vitest: jsdom units + headless-Chromium Storybook project).
      #
      # Vitest's browser-mode project intermittently fails to tear down its headless
      # Chromium after an otherwise-passing run: every test reports ✓, but the browser
      # (and its esbuild/provider handles) never close, so the Node process never exits
      # and the step hangs until the job's hard limit. It's a shutdown race, not a test
      # failure — the assertions have already passed when it wedges.
      #
      # Bound each attempt with a wall-clock timeout so a wedged run is killed in minutes
      # instead of hours, and retry once so the intermittent teardown flake self-heals.
      # A genuine test failure exits non-zero fast and fails both attempts, so this masks
      # only the browser-close hang, not real breakage. A healthy run is ~2 min.
      - name: Frontend tests (Vitest)
        working-directory: app
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=30s --signal=TERM 10m npm test; then
              exit 0
            fi
            echo "::warning::vitest did not exit cleanly (attempt ${attempt}/2) — likely the headless-browser teardown hang; retrying"
          done
          echo "::error::vitest failed on both attempts"
          exit 1

      # Real full-stack e2e last (slowest layer): backend via bootRun (e2e profile) against the
      # workflow's Postgres service container, health-gated by scripts/e2e.sh.
      - name: Real full-stack e2e
        run: make e2e

      - name: Upload backend e2e log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-e2e-log
          path: /tmp/teambalance-e2e-backend.log
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7

  # Editing an already-merged migration breaks its frozen Flyway checksum and fails validation on boot.
  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Migrations are append-only
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # No usable baseline (e.g. a branch's first push): nothing to diff against, so pass.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against — skipping append-only check."
            exit 0
          fi
          changed="$(git diff --diff-filter=MDR --name-only "$base" HEAD -- \
            'api/src/main/resources/db/migration' \
            'api/src/main/resources/db/tenant-migration')"
          if [ -n "$changed" ]; then
            echo "::error::Applied Flyway migrations were modified/deleted/renamed — migrations are append-only."
            echo "Offending files:"
            echo "$changed" | sed 's/^/  - /'
            echo "Fix: revert the change to these files. Correct docs in the ADR, and make schema changes in a NEW migration."
            exit 1
          fi
          echo "✓ No already-merged migration files were modified."

  # MANUAL deploy gate: runs only on push to `main`/`deploy*`, after `build`; each pauses for
  # approval via the `production` environment. Deploys the exact commit CI validated (tag = SHA).
  deploy-api:
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-prod-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve image tag
        id: tag
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${REGISTRY}/api:${GITHUB_SHA::12}"

      # ubuntu-latest is amd64, so --platform=linux/amd64 is native (no emulation). The Gradle build
      # (buildSrc + Java 25 toolchain) runs INSIDE the multi-stage image, so the runner needs no setup.
      # GIT_SHA is baked into the image (Dockerfile) and surfaced on /internal/actuator/info so the
      # post-deploy step below can confirm this exact image is the one serving traffic.
      - name: Build API image (linux/amd64)
        run: |
          docker build --platform=linux/amd64 -f api/Dockerfile \
            --build-arg GIT_SHA="${{ steps.tag.outputs.sha }}" \
            -t "${{ steps.tag.outputs.image }}" .

      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          version: v2.58.3
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Push image to Container Registry
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${REGISTRY%%/*}" -u nologin --password-stdin
          docker push "${{ steps.tag.outputs.image }}"

      # Image-only update: env/secret maps and the container's cpu/memory/sandbox config are left
      # untouched — those are managed manually in the Scaleway console.
      - name: Update Serverless Container image
        run: scw container container update "$CONTAINER_ID" image="${{ steps.tag.outputs.image }}" region="$SCW_REGION"

      # `container update` only *registers* the new image and returns immediately — Scaleway rolls it
      # out asynchronously. Without this gate a container that crashes on boot (e.g. a Flyway validation
      # failure) leaves the deploy job green while prod keeps serving the old revision. Poll the live
      # actuator `info` endpoint — gated by the internal API key, so the SHA is never public — until it
      # reports the exact SHA we just pushed. Non-200 / mismatched SHA = the new image isn't serving yet
      # (rollout in progress, or it crashed); we keep waiting and fail red if it never becomes live.
      # This proves the new version is actually up regardless of *why* an unhealthy image would fail.
      - name: Verify the new image is actually serving
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          EXPECTED_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://api.teambalance.nl/internal/actuator/info"
          deadline=$(( SECONDS + 360 ))
          attempt=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            body="$(curl -fsS --max-time 10 -H "X-Internal-Api-Key: ${INTERNAL_API_KEY}" "$url" 2>/dev/null || true)"
            live_sha="$(printf '%s' "$body" | jq -r '.build.sha // empty' 2>/dev/null || true)"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "✓ Live build SHA ${live_sha} matches the deployed image (attempt ${attempt})."
              exit 0
            fi
            echo "… awaiting rollout (attempt ${attempt}): live='${live_sha:-<none>}' expected='${EXPECTED_SHA}'"
            sleep 10
          done
          echo "::error::Image ${EXPECTED_SHA} never became live within $(( 360 / 60 )) min — deployment NOT verified. The new container likely failed to boot; check Scaleway Cockpit logs for a crash (e.g. Flyway validation)."
          exit 1

  deploy-frontend:
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-prod-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The SPA imports the Wirespec-generated TS client (gitignored, emitted by Gradle into
      # app/src/shared/api/generated). Generate it before the vite build or it fails on missing modules.
      - name: Generate Wirespec TypeScript client
        run: ./gradlew :api:wirespec-typescript

      # `vite build` runs in production mode and auto-loads app/.env.production
      # (VITE_API_URL=https://api.teambalance.nl).
      - name: Build SPA
        run: |
          npm ci
          npm run build
        working-directory: app

      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          version: v2.58.3
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Sync SPA + landing to Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          set -euo pipefail
          # SPA: content-hashed assets are immutable; index.html must never cache.
          # --delete removed on purpose: a client still on the previous shell (a long-open tab,
          # the installed PWA, or a stale SW) keeps referencing the last deploy's hashed chunks —
          # pruning them the instant a new deploy lands 404s those clients into a blank screen.
          # Hashes are content-addressed + immutable, so re-uploading unchanged hashes is a
          # harmless no-op and stale hashes never collide; reclaiming space is handed to a bucket
          # lifecycle rule (expire assets/ 90 days after last-modified — see docs/ops/deploy.md).
          aws --endpoint-url "$S3_ENDPOINT" s3 sync app/dist/assets "s3://${SPA_BUCKET}/assets" \
            --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp app/dist/index.html "s3://${SPA_BUCKET}/index.html" \
            --cache-control no-cache
          # PWA shell (F2): icons, master SVG and the hashed workbox runtime live at the bucket
          # root, next to index.html — they are not under assets/, so they need their own sync.
          # No --delete here: the root also holds index.html, which is uploaded separately.
          aws --endpoint-url "$S3_ENDPOINT" s3 sync app/dist "s3://${SPA_BUCKET}" \
            --exclude "assets/*" --exclude "index.html" \
            --exclude "sw.js" --exclude "registerSW.js" --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=86400"
          # The service worker, its registration script and the manifest must never be cached:
          # a stale sw.js pins every installed client to the previous deploy's precache.
          for f in sw.js registerSW.js; do
            aws --endpoint-url "$S3_ENDPOINT" s3 cp "app/dist/$f" "s3://${SPA_BUCKET}/$f" \
              --cache-control no-cache
          done
          # .webmanifest is not in the AWS CLI's mime table, so it would land as
          # application/octet-stream and be rejected as a manifest — set the type explicitly.
          aws --endpoint-url "$S3_ENDPOINT" s3 cp app/dist/manifest.webmanifest "s3://${SPA_BUCKET}/manifest.webmanifest" \
            --cache-control no-cache --content-type application/manifest+json
          # Landing page: index.html + style.css at root, tokens.css under /design-tokens/.
          aws --endpoint-url "$S3_ENDPOINT" s3 cp www/index.html "s3://${WWW_BUCKET}/index.html" \
            --cache-control no-cache
          # style.css + tokens.css are unhashed and referenced by name from index.html's <head>,
          # so they must revalidate in lockstep with it: no-cache matches index.html and prevents
          # a half-updated landing (fresh HTML, stale CSS served under the CDN default TTL).
          aws --endpoint-url "$S3_ENDPOINT" s3 cp www/style.css "s3://${WWW_BUCKET}/style.css" \
            --cache-control no-cache
          aws --endpoint-url "$S3_ENDPOINT" s3 cp design-tokens/tokens.css "s3://${WWW_BUCKET}/design-tokens/tokens.css" \
            --cache-control no-cache

      - name: Purge Edge Services cache
        run: |
          # A silently-skipped purge lets the edge keep serving a stale index.html that points at
          # pruned chunks. set -euo pipefail (matching the sync step) makes a failed purge fail the
          # job — explicit, and robust to any repo-level default-shell override that drops -e.
          set -euo pipefail
          scw edge-services purge-request create pipeline-id="$SPA_PIPELINE" all=true
          scw edge-services purge-request create pipeline-id="$WWW_PIPELINE" all=true
