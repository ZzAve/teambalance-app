config:
  validation: true
  warningsAsErrors: false

style:
  MaxLineLength:
    maxLineLength: 140

# ─── Hexagonal rulesets (flock-detekt) — see ADR-0018 ────────────────────────
# Every rule is inactive until switched on here, so the `active: true` lines are
# activation, not configuration. Rule PROPERTIES are deliberately left out: flock's
# defaults already describe this codebase (port packages, port suffixes, adapter
# packages/patterns, forbidden framework imports, DTO/service suffixes).
#
# Two package tokens do need overriding, because flock matches package SEGMENTS and
# our layers are not named the way its defaults assume:
#
#   domainPackages: our `application` layer must be as framework-free as `domain`,
#                   and we have no `core` package.
#   apiPackages:    our inbound layer is `interfaces`. The default token `api` is
#                   actively harmful here — the root package is
#                   com.github.zzave.teambalance.api, so `api` matches every file.

hexagonal-domain:
  active: true
  excludes: ['**/src/test/**']
  DomainNoPrimitiveObsession:
    active: true
    domainPackages: ['domain', 'application']
    # Booleans are not primitive obsession. The smell this rule names is a value whose
    # *domain meaning* is wider than its representation — a String that is really a slug,
    # an Int that is really a count of minutes — so wrapping it buys a name, a format and
    # somewhere for the invariant to live. A Boolean already has exactly two values and no
    # invariant to state: `TeamMember.onboarded` is the whole vocabulary, and an
    # `Onboarded(value: Boolean)` wrapper would add a level of unwrapping at every edge
    # while forbidding nothing. Excluded at rule level rather than wrapped or baselined
    # (see #207 out-of-scope). This is the ONE primitive type retired here; String/Int/Long
    # and the rest stay enforced across domain + application, and the 12 value classes this
    # epic added are the proof that the rule is doing real work (see ADR-0018).
    allowedPrimitives: ['Boolean']
  DomainNoFrameworkImports:
    active: true
    domainPackages: ['domain', 'application']
    # The e2e magic-link recorder is test scaffolding that has to be a Spring bean: the database only
    # stores the token hash, so `@Profile("e2e")` is what keeps this in-memory plaintext store out of
    # every other context — dropping the annotations to satisfy the rule would remove that guarantee.
    # It sits in `application` because both an infrastructure adapter (RecordingEmailAdapter) and an
    # inbound controller (E2eSupportController) hold it; moving it under `infrastructure/e2e` next to
    # E2eEnvironmentInitializer only trades these two findings for two others, since the controller
    # would then breach ApiCannotDependOnAdapters and the email adapter AdapterCannotDependOnAdapter.
    # Excluded by exact file glob, not by trimming `forbiddenImports`: every other file under
    # domain/ and application/ is still held to a framework-free line (see #184 / ADR-0018).
    excludes: ['**/application/E2eMagicLinkTokenRecorder.kt']
  # Opt-in allow-list, stricter than DomainNoFrameworkImports' deny-list. Left off
  # (flock's own default) — the deny-list is the line this epic enforces.
  DomainModelMustBeStandalone:
    active: false
  DomainMustBeImmutable:
    active: true
    domainPackages: ['domain', 'application']
  ValueClassMustHaveJvmInline:
    active: true
    domainPackages: ['domain', 'application']

hexagonal-port:
  active: true
  excludes: ['**/src/test/**']
  PortMustBeInterface:
    active: true
  PortNamingConvention:
    active: true
  PortsInDomainOnly:
    active: true
    domainPackages: ['domain', 'application']
    apiPackages: ['interfaces']
    # The rule flags any INTERFACE in an adapter package whose name ends in a port suffix, and
    # `Repository` is one. Spring Data's query interfaces (`interface Foo : JpaRepository<..>`, no
    # implementation of ours — Spring generates the proxy) are that shape by framework convention,
    # so all nine trip a rule they cannot satisfy: they are not ports, and moving them to `domain`
    # would drag JpaRepository + the JPA entities in with them, which is precisely what
    # DomainNoFrameworkImports forbids. The real port is the hand-written `domain/port/*Repository`
    # that `Jpa*RepositoryAdapter` implements by delegating to one of these.
    # Excluded by exact file glob, not by dropping `Repository` from portSuffixes: every other
    # port-suffixed interface under infrastructure/ is still a violation, and a new Spring Data
    # interface has to be named into this pattern to be exempt (see #184 / ADR-0018).
    excludes: ['**/infrastructure/persistence/SpringData*Repository.kt']

hexagonal-adapter:
  active: true
  excludes: ['**/src/test/**']
  AdapterMustImplementPort:
    active: true
  AdapterNamingConvention:
    active: true
  AdapterCannotDependOnAdapter:
    active: true

hexagonal-dependency:
  active: true
  excludes: ['**/src/test/**']
  DomainCannotDependOnAdapters:
    active: true
    domainPackages: ['domain', 'application']
  DomainCannotDependOnApi:
    active: true
    domainPackages: ['domain', 'application']
    apiPackages: ['interfaces']
  ApiCannotDependOnAdapters:
    active: true
    apiPackages: ['interfaces']
  ApiCannotDependOnPorts:
    active: true
    apiPackages: ['interfaces']
    # The two identity gateways answer "who is calling, and for which team" — request context the
    # inbound adapter owns, not data the application reaches out for. Controllers read them and pass
    # the ids in as explicit arguments, which is what keeps the services pure functions of their
    # parameters (see #19 / ADR-0018). Exempted by exact type name, so no other port slips through;
    # AuthController's TeamMemberRepository dependency is a real breach and stays baselined.
    allowedPortTypes: ['CurrentUserGateway', 'CurrentTeamGateway']

hexagonal-layering:
  active: true
  excludes: ['**/src/test/**']
  DtoOnlyInAdaptersOrApi:
    active: true
    domainPackages: ['domain', 'application']
    apiPackages: ['interfaces']
  NoServiceInApiOrAdapter:
    active: true
    apiPackages: ['interfaces']
