spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/teambalance
    username: teambalance
    password: teambalance

teambalance:
  platform-admins: admin@teambalance.nl
  invitation:
    # Dev-only salt (not a live environment) so bootRun works without INVITATION_TOKEN_SALT set.
    token-salt: dev-invitation-salt
    # Dev-only key (not a live environment); live supplies INVITATION_TOKEN_ENCRYPTION_KEY.
    token-encryption-key: dGVhbWJhbGFuY2UtZGV2LWludml0YXRpb24ta2V5LTE=
  # Local SPA origin, where the Bunq OAuth callback sends the Admin back to.
  frontend-base-url: http://localhost:5173
  bunq:
    # Dev-only (not a live environment); connects through the fake Bunq authorize page.
    connect-enabled: true
    token-encryption-key: dGVhbWJhbGFuY2UtZGV2LWJ1bnEtdG9rZW4ta2V5LTE=
  # Local API origin, so a calendar link created against `make api` is fetchable as-is.
  api-base-url: http://localhost:8080
  calendar-link:
    # Dev-only secrets (not a live environment) so bootRun works without the env vars set.
    token-salt: dev-calendar-link-salt
    token-encryption-key: dGVhbWJhbGFuY2UtZGV2LWNhbGVuZGFyLWtleS0xMjM=

logging:
  level:
    com.github.zzave.teambalance.api: DEBUG
    org.hibernate.SQL: DEBUG