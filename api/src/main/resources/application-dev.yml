spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/teambalance
    username: teambalance
    password: teambalance
  flyway:
    schemas:
      - public
  data:
    redis:
      host: localhost
      port: 6379

teambalance:
  invitation:
    # Dev-only salt (not a live environment) so bootRun works without INVITATION_TOKEN_SALT set.
    token-salt: dev-invitation-salt

logging:
  level:
    com.github.zzave.teambalance.api: DEBUG
    org.hibernate.SQL: DEBUG