# Dedicated profile for real full-stack e2e runs (Playwright against real FE + BE + DB).
# Activates: team_test tenant provisioning + seed fixture (E2eEnvironmentInitializer) and the
# /internal/e2e/magic-link-token support endpoint. Never combine with prod; distinct from the
# `test` profile used by Kotest/Testcontainers ITs (which override the datasource anyway).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/teambalance
    username: teambalance
    password: teambalance

teambalance:
  # The act-as flow needs a Platform Admin (ADR-0024). Fail-closed by default, so name one here; the
  # seed fixture creates this user WITHOUT a team_members row, which is the point (ADR-0024 section 3).
  platform-admins: platform@example.com
  invitation:
    # Hardcoded salt for e2e runs (not a live environment); live supplies INVITATION_TOKEN_SALT.
    token-salt: e2e-invitation-salt
    # Hardcoded key for e2e runs; live supplies INVITATION_TOKEN_ENCRYPTION_KEY.
    token-encryption-key: dGVhbWJhbGFuY2UtZTJlLWludml0YXRpb24ta2V5LTE=
  rate-limit:
    # Generous ceilings for the full-stack suite: every Playwright test logs in via the magic-link
    # flow from the same CI IP, so the default per-IP limits (5–10/min) would throttle later tests and
    # fail the run. The filter stays enabled (its wiring is still in the request path); the low-limit
    # 429 behaviour itself is proven by RateLimitIT, not by the e2e suite.
    magic-link-request:
      capacity: 1000
    magic-link-verify:
      capacity: 1000
    invitation-accept:
      capacity: 1000
