# Dedicated profile for real full-stack e2e runs (Playwright against real FE + BE + DB).
# Activates: team_test tenant provisioning + seed fixture (E2eEnvironmentInitializer) and the
# /internal/e2e/magic-link-token support endpoint. Never combine with prod; distinct from the
# `test` profile used by Kotest/Testcontainers ITs (which override the datasource anyway).
# Own database (scripts/e2e.sh creates it): the demo reset step drops every schema, so it must not be dev's `teambalance`.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/teambalance_e2e
    username: teambalance
    password: teambalance

teambalance:
  # The demo team is one more tenant in the e2e DB (guest-login e2e, ADR-0043). The boot check needs email.send=false and bunq.environment=fake.
  demo:
    enabled: true
  email:
    send: false
  # The act-as flow needs a Platform Admin (ADR-0024). Fail-closed by default, so name one here; the
  # seed fixture creates this user WITHOUT a team_members row, which is the point (ADR-0024 section 3).
  # A second admin (platform2@example.com) is named for the memberless-handover spec so it never races
  # the act-as spec for platform@example.com's single magic-link token. It needs no seed row — its
  # first sign-in creates it teamless, which is exactly the state a Platform Admin must be in.
  platform-admins: platform@example.com, platform2@example.com
  invitation:
    # Hardcoded salt for e2e runs (not a live environment); live supplies INVITATION_TOKEN_SALT.
    token-salt: e2e-invitation-salt
    # Hardcoded key for e2e runs; live supplies INVITATION_TOKEN_ENCRYPTION_KEY.
    token-encryption-key: dGVhbWJhbGFuY2UtZTJlLWludml0YXRpb24ta2V5LTE=
  api-base-url: http://localhost:8080
  # Local SPA origin, where the Bunq OAuth callback sends the Admin back to.
  frontend-base-url: http://localhost:5173
  bunq:
    # The fake Bunq, as with none outside prod (the connect specs use its approval page); the demo boot check wants fake.
    environment: fake
    # Hardcoded for e2e runs (not a live environment); connects through the fake Bunq authorize page.
    connect-enabled: true
    token-encryption-key: dGVhbWJhbGFuY2UtZTJlLWJ1bnEtdG9rZW4ta2V5LTE=
  calendar-link:
    # Hardcoded secrets for e2e runs (not a live environment).
    token-salt: e2e-calendar-link-salt
    token-encryption-key: dGVhbWJhbGFuY2UtZTJlLWNhbGVuZGFyLWtleS0xMjM=
  rate-limit:
    # Generous ceilings for the full-stack suite: every Playwright test logs in via the magic-link
    # flow from the same CI IP, so the default per-IP limits (5–10/min) would throttle later tests and
    # fail the run. The filter stays enabled (its wiring is still in the request path); the low-limit
    # 429 behaviour itself is proven by RateLimitIT, not by the e2e suite.
    magic-link-request:
      capacity: 1000
    magic-link-verify:
      capacity: 1000
    passkey-login:
      capacity: 1000
    demo-session:
      capacity: 1000
    invitation-accept:
      capacity: 1000
    calendar-feed-per-client:
      capacity: 100000
    bunq-oauth-callback:
      capacity: 1000
