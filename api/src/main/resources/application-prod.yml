# Production profile — activated on the Scaleway Serverless Container (fr-par) via
# SPRING_PROFILES_ACTIVE=prod. The datasource and all secrets (DB creds, INVITATION_TOKEN_SALT,
# Scaleway TEM api-key/project-id, TEAMBALANCE_FRONTEND_BASE_URL) are supplied as container
# environment variables via Spring relaxed binding — never committed here. This profile also
# activates ScalewayTemEmailSender (@Profile("prod")) in place of ConsoleEmailSender.

spring:
  datasource:
    hikari:
      # The prod Serverless SQL DB scales to zero after ~5 min idle. Keep NO minimum idle pool so
      # Hikari lets connections drain to zero instead of proactively reopening them to maintain a
      # minimum — otherwise that reopening traffic keeps waking the DB and defeats scale-to-zero.
      # Connections are opened on demand; the DB resumes in <5s, well within the default 30s
      # connectionTimeout. See docs/plans/2026-07-17-v1-production-launch-scaleway.md.
      minimum-idle: 0

# Split-origin CORS (launch blocker #3): the SPA (app.teambalance.nl) and landing page
# (teambalance.nl) call api.teambalance.nl cross-origin with the session cookie. See WebConfig.
teambalance:
  cors:
    allowed-origins: https://app.teambalance.nl,https://teambalance.nl

server:
  servlet:
    session:
      cookie:
        # Session cookie is HTTPS-only. app.teambalance.nl -> api.teambalance.nl is the same
        # registrable site (teambalance.nl), so SameSite=Lax is sufficient for the cookie to ride
        # the SPA's credentialed cross-origin requests.
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # Blocker #5: expose only the health probe, the startup timing endpoint, and `info` in prod.
        # metrics (exposed in the base config for local use) stays off. InternalEndpointGuardFilter is
        # the real boundary: it 403s everything under /internal/actuator except `health` — `startup`
        # only while the teambalance.startup.actuator.enabled flag is set, and `info` only for a caller
        # presenting the X-Internal-Api-Key. `info` is registered here so the guarded deploy-verify
        # probe can read the running image's build SHA; without the key it is a 403 from the internet.
        include: health,startup,info
