spring:
  application:
    name: teambalance-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Startup: pin the dialect and skip Hibernate's boot-time JDBC metadata probe (the
        # "Database version: 16.x / dialect: PostgreSQLDialect" round-trip seen in boot logs). The two
        # go together — with the probe off Hibernate can't auto-detect the dialect, so it must be set.
        # Every environment (prod + Testcontainers) is PostgreSQL, so this is safe app-wide.
        # See docs/plans/2026-07-24-startup-time-optimization.md.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
  data:
    jpa:
      repositories:
        # Initialize JPA repositories on a background thread instead of on the boot critical path.
        # `deferred` (not `lazy`) still forces initialization to complete before the context is
        # marked ready, so any repository wiring error still surfaces at startup.
        bootstrap-mode: deferred
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Pin the platform migrations to `public` for ALL profiles. Without this, Boot's auto-Flyway
    # targets the connection's ambient search_path; in prod that defaulted to a tenant schema (left
    # over from manual tenant provisioning), so a platform migration landed in the tenant schema
    # instead of `public`. Platform tables (users, teams, sessions, …) live in `public` by design.
    schemas:
      - public
  jackson:
    default-property-inclusion: non_null
  session:
    # Sessions are stored in Postgres (public.SPRING_SESSION) instead of the servlet container's
    # in-memory HttpSession. This is what lets a login survive a container restart / cold start /
    # redeploy — on Scaleway Serverless with min-instances=0 every new pod boot would otherwise start
    # with an empty heap-resident session table and silently log everyone out.
    jdbc:
      # Flyway owns the schema (db/migration/V005__spring_session.sql); never let Spring Session run DDL.
      initialize-schema: never
      # Schema-qualify so session queries always resolve to `public`, independent of the tenant
      # search_path the multitenancy connection provider may have left on a pooled connection.
      table-name: public.SPRING_SESSION
    servlet:
      # Spring Session's repository filter must wrap the request BEFORE SessionUserContextFilter
      # (HIGHEST_PRECEDENCE+2) and SessionTenantContextFilter (+3) call request.getSession(); its
      # default order (MIN_VALUE+50) would run after them, so they'd read the raw servlet session
      # instead of the JDBC-backed one. Force it to the very front (Integer.MIN_VALUE).
      filter-order: -2147483648
  http:
    client:
      # Global default for every RestClient built from the auto-configured builder. Today the only
      # outbound client is the Scaleway TEM email adapter; a hung provider must not hang the login
      # request. Any future outbound client inherits these — override per-client if it needs more.
      connect-timeout: 5s
      read-timeout: 10s

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # Sliding idle window: a session stays valid as long as it is used at least once every 4 weeks
      # (Spring Session refreshes the row's expiry on each request). Long by design — logging in is a
      # magic-link round-trip, so we favour staying logged in (ADR-0015).
      timeout: 28d
      cookie:
        # Persist the cookie across browser restarts (default is a session cookie cleared on close),
        # up to the absolute lifetime cap so it never expires before the server-side session does.
        max-age: 90d

management:
  endpoints:
    web:
      base-path: /internal/actuator
      exposure:
        # `startup` exports the BufferingApplicationStartup timing tree (the detailed per-step boot
        # attribution). The canonical cold-start metric remains the Spring
        # `Started TeamBalanceApplication in X seconds` log line. The endpoint is always exposed; prod
        # narrows this list to `health,startup` (application-prod.yml) and InternalEndpointGuardFilter
        # 403s everything under /internal/actuator except `health` — and `startup` only while the
        # teambalance.startup.actuator.enabled flag is set (perf-test window). See #95.
        include: health,info,metrics,startup
  info:
    # Surface the `info.*` properties below (the deployed image's build SHA) on /internal/actuator/info.
    # Off by default in Spring Boot, so the deploy-verify probe would otherwise see an empty payload.
    env:
      enabled: true

info:
  build:
    # The git SHA of the running image, injected at container-build time (Dockerfile ARG GIT_SHA →
    # ENV TEAMBALANCE_BUILD_SHA). The deploy pipeline reads this back from the live container to prove
    # the exact image it pushed is actually serving. `unknown` in local/dev where nothing bakes it.
    sha: ${TEAMBALANCE_BUILD_SHA:unknown}

teambalance:
  startup:
    actuator:
      # Perf-testing toggle for the Spring `startup` actuator endpoint. The endpoint is always
      # registered/exposed; this flag only controls whether InternalEndpointGuardFilter lets
      # /internal/actuator/startup through in prod. Default false: the guard 403s it. Set to true to
      # read the BufferingApplicationStartup boot-timing tree from the live container during a
      # perf-test window, then unset it. Spring relaxed binding maps the env var
      # TEAMBALANCE_STARTUP_ACTUATOR_ENABLED to this property. See issue #95.
      enabled: false
  internal:
    # Shared secret that opens the non-health `/internal` surface (actuator info/metrics) to a caller
    # presenting it as the X-Internal-Api-Key header. Only the deploy pipeline and the container's env
    # hold it; unset here (empty default) → InternalEndpointGuardFilter stays fail-closed and info is a
    # 403 from the internet. Live environments provide it via INTERNAL_API_KEY.
    api-key: ${INTERNAL_API_KEY:}
  # Base URL of the SPA; used to build the clickable magic-link (…/auth/verify?token=…).
  frontend-base-url: ${TEAMBALANCE_FRONTEND_BASE_URL:https://app.teambalance.nl}
  # Comma-separated platform-admin emails (PLATFORM_ADMIN_EMAILS). Empty default = fail-closed: nobody
  # is a platform admin. Gates the creation-codes admin surface (#154 Slice 4) and receives the
  # "code consumed → team created" audit notifications. See ADR-0019.
  platform-admins: ${PLATFORM_ADMIN_EMAILS:}
  session:
    # Absolute session lifetime, enforced by SessionUserContextFilter (Spring Session itself only does
    # the sliding idle timeout above). A single login — even one kept continuously active — must
    # re-authenticate after this, bounding how long a leaked cookie stays useful. See ADR-0015.
    absolute-timeout: 90d
  invitation:
    # App-wide secret salt applied to stored invite-token hashes. Live environments MUST provide it
    # via INVITATION_TOKEN_SALT (no default here → the app fails fast if it is unset). Dev and test
    # override it with a hardcoded value in their profile config.
    token-salt: ${INVITATION_TOKEN_SALT}
  email:
    # Scaleway Transactional Email (TEM). Consumed only by the prod-profile ScalewayTemEmailAdapter.
    # api-key/project-id have no default → prod fails fast if the secrets are unset (dev/test/e2e
    # use ConsoleEmailAdapter and never read these).
    from-name: TeamBalance
    from-address: login@teambalance.nl
    region: ${SCALEWAY_TEM_REGION:fr-par}
    api-key: ${SCALEWAY_TEM_API_KEY}
    project-id: ${SCALEWAY_TEM_PROJECT_ID}
