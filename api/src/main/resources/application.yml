spring:
  application:
    name: teambalance-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Startup: pin the dialect and skip Hibernate's boot-time JDBC metadata probe (the
        # "Database version: 16.x / dialect: PostgreSQLDialect" round-trip seen in boot logs). The two
        # go together — with the probe off Hibernate can't auto-detect the dialect, so it must be set.
        # Every environment (prod + Testcontainers) is PostgreSQL, so this is safe app-wide.
        # See docs/plans/2026-07-24-startup-time-optimization.md.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
  data:
    jpa:
      repositories:
        # Initialize JPA repositories on a background thread instead of on the boot critical path.
        # `deferred` (not `lazy`) still forces initialization to complete before the context is
        # marked ready, so any repository wiring error still surfaces at startup.
        bootstrap-mode: deferred
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  # No Spring Session store is configured: 1.0 uses the servlet container's in-memory HttpSession
  # (JSESSIONID) per ADR-0010. Spring Session + Redis were removed from the classpath (they had zero
  # references in main and forced Spring Data "multiple-modules strict mode" onto the boot path); a
  # future Phase-5 shared-session store re-adds them deliberately when it is actually needed.
  http:
    client:
      # Global default for every RestClient built from the auto-configured builder. Today the only
      # outbound client is the Scaleway TEM email adapter; a hung provider must not hang the login
      # request. Any future outbound client inherits these — override per-client if it needs more.
      connect-timeout: 5s
      read-timeout: 10s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal/actuator
      exposure:
        # `startup` exports the BufferingApplicationStartup timing tree (the detailed per-step boot
        # attribution). The canonical cold-start metric remains the Spring
        # `Started TeamBalanceApplication in X seconds` log line. It is exposed here for local/dev use.
        # In prod the include list narrows to `health` only (application-prod.yml) and
        # InternalEndpointGuardFilter 403s everything else under /internal/actuator. To read the
        # timing tree from a live prod container during a perf-test window, set
        # teambalance.startup-actuator.enabled=true (STARTUP_ACTUATOR_ENABLED): it appends `startup` to
        # this list (StartupActuatorExposureEnvironmentPostProcessor) and opens the guard. See #95.
        include: health,info,metrics,startup

teambalance:
  startup-actuator:
    # Perf-testing toggle for the Spring `startup` actuator endpoint. Default false: prod exposes
    # `health` only and InternalEndpointGuardFilter 403s /internal/actuator/startup. Set to true (via
    # STARTUP_ACTUATOR_ENABLED on the container) to append `startup` to the actuator exposure list
    # (StartupActuatorExposureEnvironmentPostProcessor) and open the guard, so the
    # BufferingApplicationStartup boot-timing tree can be read from the live container — then unset it.
    # See issue #95.
    enabled: ${STARTUP_ACTUATOR_ENABLED:false}
  # Base URL of the SPA; used to build the clickable magic-link (…/auth/verify?token=…).
  frontend-base-url: ${TEAMBALANCE_FRONTEND_BASE_URL:https://app.teambalance.nl}
  invitation:
    # App-wide secret salt applied to stored invite-token hashes. Live environments MUST provide it
    # via INVITATION_TOKEN_SALT (no default here → the app fails fast if it is unset). Dev and test
    # override it with a hardcoded value in their profile config.
    token-salt: ${INVITATION_TOKEN_SALT}
  email:
    # Scaleway Transactional Email (TEM). Consumed only by the prod-profile ScalewayTemEmailSender.
    # api-key/project-id have no default → prod fails fast if the secrets are unset (dev/test/e2e
    # use ConsoleEmailSender and never read these).
    from-name: TeamBalance
    from-address: login@teambalance.nl
    region: ${SCALEWAY_TEM_REGION:fr-par}
    api-key: ${SCALEWAY_TEM_API_KEY}
    project-id: ${SCALEWAY_TEM_PROJECT_ID}