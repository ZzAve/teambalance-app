<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TeamBalance</title>

    <!-- PWA shell (F2). The manifest, the service worker and the registerSW.js link are injected
         by vite-plugin-pwa at build time; the icons below are committed under public/ and
         generated from public/tb-monogram.svg (see app/pwa-assets.config.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/tb-monogram.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- iOS reads these instead of the manifest when the app is added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TeamBalance" />
    <!-- Static light value (--color-background). F11 (dark mode) makes this follow the active
         theme — it will need a matching dark value here and in src/app/pwa/manifest.ts. -->
    <meta name="theme-color" content="#F8F6F0" />
    <!--
      Cold-start wake-up. The prod backend scales to zero, so kick it awake as early as possible —
      during HTML parse, before the JS bundle even downloads — so the container is already warming
      by the time the session probe runs. Fire-and-forget against the cheap public /api/ping (204,
      no DB, no auth). Vite substitutes %VITE_API_URL% at build; dev/e2e define it empty so it
      resolves to a relative URL (same-origin via the Vite proxy). Prod is split-origin
      (app.teambalance.nl → api.teambalance.nl), so we also warm DNS/TLS with a preconnect.
    -->
    <script>
      (function () {
        var api = '%VITE_API_URL%'
        if (!api || api.charAt(0) === '%') api = ''
        if (api) {
          var link = document.createElement('link')
          link.rel = 'preconnect'
          link.href = api
          link.crossOrigin = 'anonymous'
          document.head.appendChild(link)
        }
        try {
          fetch(api + '/api/ping', { credentials: 'omit', cache: 'no-store' }).catch(function () {})
        } catch (e) {
          /* wake ping is best-effort — never let it break boot */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
