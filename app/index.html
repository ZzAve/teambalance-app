<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TeamBalance</title>

    <!-- PWA shell (F2). The manifest and the service worker are emitted by vite-plugin-pwa at build
         time; registration is bundled into the app itself (SwUpdateManager via
         virtual:pwa-register/react), not a plugin-injected registerSW.js — so the app owns update
         timing (caching plan Phase 3). The icons below are committed under public/ and generated
         from public/tb-monogram.svg (see app/pwa-assets.config.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/tb-monogram.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- iOS reads these instead of the manifest when the app is added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TeamBalance" />
    <!-- Light `--color-background`. Kept as the document default; the bootstrap below rewrites it
         to the dark background when the dark theme wins, so the address bar tracks the page (F11). -->
    <meta name="theme-color" content="#F8F6F0" />
    <!--
      Pre-paint theme bootstrap (F11, #159). This has to run here, inline and synchronous, rather
      than from the app bundle: the class it sets decides the very first frame, and doing it after
      the module graph loads would paint a light screen and then flip it — the flash dark mode
      exists to avoid.

      It is deliberately a duplicate of shared/theme: the storage key, the media query and the two
      theme-color values are repeated as literals because an inline script cannot import. That copy
      is not left to drift — src/shared/theme/theme.test.ts reads this file and asserts every one of
      those literals still matches the module's constants.
    -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('tb-theme')
          if (preference !== 'light' && preference !== 'dark') preference = 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#141210')
          }
        } catch (e) {
          /* No storage or no matchMedia — fall through to the light default in the markup. */
        }
      })()
    </script>
    <!--
      Cold-start wake-up. The prod backend scales to zero, so kick it awake as early as possible —
      during HTML parse, before the JS bundle even downloads — so the container is already warming
      by the time the session probe runs. Fire-and-forget against the cheap public /api/ping (204,
      no DB, no auth). Vite substitutes %VITE_API_URL% at build; dev/e2e define it empty so it
      resolves to a relative URL (same-origin via the Vite proxy). Prod is split-origin
      (app.teambalance.nl → api.teambalance.nl), so we also warm DNS/TLS with a preconnect.
    -->
    <script>
      (function () {
        var api = '%VITE_API_URL%'
        if (!api || api.charAt(0) === '%') api = ''
        if (api) {
          var link = document.createElement('link')
          link.rel = 'preconnect'
          link.href = api
          link.crossOrigin = 'anonymous'
          document.head.appendChild(link)
        }
        try {
          fetch(api + '/api/ping', { credentials: 'omit', cache: 'no-store' }).catch(function () {})
        } catch (e) {
          /* wake ping is best-effort — never let it break boot */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
