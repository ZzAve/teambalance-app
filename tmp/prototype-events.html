<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TeamBalance — Events Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Grandstander:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #225C9C;
    --primary-light: #2d6fb5;
    --primary-dark: #1a4a7e;
    --primary-bg: rgba(34, 92, 156, 0.08);
    --primary-bg-hover: rgba(34, 92, 156, 0.05);
    --primary-glow: rgba(34, 92, 156, 0.15);

    --accent-green: #249E6C;
    --accent-green-light: #2ab87d;
    --accent-green-bg: rgba(36, 158, 108, 0.10);

    --warm-gold: #F4B400;
    --warm-gold-light: #f7c948;
    --warm-gold-bg: rgba(244, 180, 0, 0.12);

    --warm-red: #E05252;
    --warm-red-bg: rgba(224, 82, 82, 0.10);

    --bg: #F8F6F0;
    --bg-card: #FEFDFB;
    --bg-sidebar: #F3F1EB;
    --bg-bottombar: rgba(254, 253, 251, 0.88);

    --text-primary: #1E2A3A;
    --text-secondary: #5A6B7F;
    --text-tertiary: #8A95A5;
    --text-on-primary: #FFFFFF;

    --border: rgba(30, 42, 58, 0.07);
    --shadow-sm: 0 1px 3px rgba(62, 45, 30, 0.05), 0 1px 2px rgba(62, 45, 30, 0.03);
    --shadow-md: 0 4px 12px rgba(62, 45, 30, 0.07), 0 2px 4px rgba(62, 45, 30, 0.04);
    --shadow-lg: 0 8px 24px rgba(62, 45, 30, 0.09), 0 4px 8px rgba(62, 45, 30, 0.04);
    --shadow-nav: 0 -1px 16px rgba(62, 45, 30, 0.06);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-pill: 24px;

    --topbar-height: 60px;
    --bottombar-height: 72px;

    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);

    --font-display: 'Grandstander', cursive;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }

  html {
    font-family: var(--font-body);
    color: var(--text-primary);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.6;
    letter-spacing: 0.01em;
  }

  body {
    min-height: 100dvh;
    overflow: hidden;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-body);
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }

  /* ── Top Bar ────────────────────────────────── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-height);
    background: linear-gradient(180deg, rgba(254, 253, 251, 0.97) 0%, rgba(248, 246, 240, 0.95) 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 21px;
    user-select: none;
    display: flex;
    align-items: baseline;
    gap: 1px;
    letter-spacing: -0.01em;
  }

  .wordmark .wm-team { font-weight: 400; color: var(--text-primary); }
  .wordmark .wm-balance { font-weight: 700; color: var(--accent-green); }

  .team-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    background: var(--primary-bg);
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    cursor: default;
    letter-spacing: 0.02em;
  }

  .team-indicator .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent-green);
  }

  /* ── Bottom Bar (Mobile) ───────────────────── */
  .bottombar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--bottombar-height);
    background: var(--bg-bottombar);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid rgba(30, 42, 58, 0.06);
    box-shadow: var(--shadow-nav);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8px;
    padding-bottom: env(safe-area-inset-bottom, 0);
    z-index: 100;
  }

  .tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 20px;
    border-radius: var(--radius-pill);
    border: none;
    background: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-tertiary);
    transition: color 0.25s var(--ease-smooth);
    position: relative;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.02em;
  }

  .tab-btn svg {
    width: 22px; height: 22px;
    transition: transform 0.3s var(--ease-spring), color 0.2s, filter 0.3s;
  }

  .tab-btn .tab-pill {
    position: absolute;
    top: 2px; left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 48px; height: 30px;
    border-radius: 15px;
    background: var(--primary-bg);
    transition: transform 0.35s var(--ease-spring);
    z-index: -1;
  }

  .tab-btn.active { color: var(--primary); font-weight: 600; }

  .tab-btn.active svg {
    transform: scale(1.1) translateY(-1px);
    color: var(--primary);
    filter: drop-shadow(0 0 4px var(--primary-glow));
  }

  .tab-btn.active .tab-pill {
    transform: translateX(-50%) scaleX(1);
    background: var(--primary-bg);
    box-shadow: 0 0 12px var(--primary-glow);
  }

  .tab-btn .tab-badge {
    position: absolute;
    top: 0; right: 12px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--warm-gold);
    border: 2px solid var(--bg-card);
  }

  /* ── Screen Container ───────────────────────── */
  .screen-container {
    position: fixed;
    top: var(--topbar-height);
    left: 0; right: 0;
    bottom: var(--bottombar-height);
    overflow: hidden;
  }

  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 24px 20px 32px;
    transition: transform 0.4s var(--ease-smooth), opacity 0.35s var(--ease-smooth);
    will-change: transform, opacity;
  }

  .screen-inner {
    max-width: 640px;
    margin: 0 auto;
  }

  /* List screen */
  #screen-list {
    transform: translateX(0);
    opacity: 1;
  }

  #screen-list.pushed {
    transform: translateX(-30%);
    opacity: 0.4;
    pointer-events: none;
  }

  /* Detail screen */
  #screen-detail {
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }

  #screen-detail.visible {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }

  /* ── Filter Bar ─────────────────────────────── */
  .filter-bar {
    margin-bottom: 20px;
  }

  .time-toggle {
    display: flex;
    background: rgba(30, 42, 58, 0.05);
    border-radius: var(--radius-pill);
    padding: 3px;
    margin-bottom: 14px;
    width: fit-content;
  }

  .time-toggle-btn {
    padding: 8px 22px;
    border: none;
    background: none;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s var(--ease-spring);
    letter-spacing: 0.01em;
    -webkit-tap-highlight-color: transparent;
  }

  .time-toggle-btn.active {
    background: var(--bg-card);
    color: var(--text-primary);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  .type-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .type-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    border: 1.5px solid var(--border);
    background: var(--bg-card);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.25s var(--ease-spring);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .type-pill:hover {
    border-color: rgba(30, 42, 58, 0.15);
  }

  .type-pill.active {
    border-color: var(--primary);
    background: var(--primary-bg);
    color: var(--primary);
    font-weight: 600;
  }

  .type-pill.active.training { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
  .type-pill.active.match { border-color: var(--accent-green); color: var(--accent-green); background: var(--accent-green-bg); }
  .type-pill.active.misc { border-color: var(--warm-gold); color: #a07600; background: var(--warm-gold-bg); }

  .type-pill .pill-icon {
    width: 14px; height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  /* ── Event Cards ────────────────────────────── */
  .event-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: box-shadow 0.2s, transform 0.2s var(--ease-spring);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .event-card + .event-card {
    margin-top: 12px;
  }

  .event-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .event-card:active {
    transform: scale(0.985);
    box-shadow: var(--shadow-sm);
    transition-duration: 0.08s;
  }

  .event-card-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .event-type-icon {
    width: 42px; height: 42px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .event-type-icon svg { width: 20px; height: 20px; }

  .event-type-icon.training { background: var(--primary-bg); color: var(--primary); }
  .event-type-icon.match { background: var(--accent-green-bg); color: var(--accent-green); }
  .event-type-icon.misc { background: var(--warm-gold-bg); color: #c89200; }

  .event-card-body { flex: 1; min-width: 0; }

  .event-type-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .event-type-badge.training { background: var(--primary-bg); color: var(--primary); }
  .event-type-badge.match { background: var(--accent-green-bg); color: var(--accent-green); }
  .event-type-badge.misc { background: var(--warm-gold-bg); color: #a07600; }

  .event-title {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .event-meta {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .event-meta svg {
    width: 13px; height: 13px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .event-meta-sep {
    color: var(--text-tertiary);
  }

  .event-card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    gap: 10px;
    flex-wrap: wrap;
  }

  .my-status-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  .my-status-chip .chip-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .my-status-chip.going { background: var(--accent-green-bg); color: var(--accent-green); }
  .my-status-chip.maybe { background: var(--warm-gold-bg); color: #a07600; }
  .my-status-chip.absent { background: var(--warm-red-bg); color: var(--warm-red); }
  .my-status-chip.notset { background: rgba(138, 149, 165, 0.10); color: var(--text-tertiary); }

  .attendee-summary {
    font-size: 12px;
    color: var(--text-tertiary);
    letter-spacing: 0.01em;
    text-align: right;
    flex: 1;
    min-width: 0;
  }

  /* ── Section Heading ────────────────────────── */
  .section-heading {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    margin-top: 24px;
  }

  .section-heading:first-child { margin-top: 0; }

  .tab-header { margin-bottom: 22px; }

  .tab-header h1 {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 5px;
    color: var(--text-primary);
  }

  .tab-header p {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    letter-spacing: 0.01em;
  }

  /* ── Detail Screen ──────────────────────────── */
  .detail-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px 8px 10px;
    border: none;
    background: rgba(30, 42, 58, 0.05);
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s var(--ease-smooth);
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 20px;
  }

  .detail-back:hover { background: rgba(30, 42, 58, 0.08); color: var(--text-primary); }
  .detail-back:active { transform: scale(0.96); }

  .detail-back svg { width: 18px; height: 18px; }

  .detail-header {
    margin-bottom: 28px;
  }

  .detail-header .event-type-badge {
    margin-bottom: 8px;
  }

  .detail-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    margin-bottom: 10px;
    line-height: 1.15;
  }

  .detail-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .detail-info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
  }

  .detail-info-row svg {
    width: 16px; height: 16px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  /* ── Attendance Action Buttons ──────────────── */
  .attendance-actions {
    margin-bottom: 28px;
  }

  .attendance-actions-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }

  .attendance-btns {
    display: flex;
    gap: 10px;
  }

  .att-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 14px 10px;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s var(--ease-spring);
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.01em;
    position: relative;
    overflow: hidden;
  }

  .att-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .att-btn.attending {
    border: 2px solid var(--accent-green);
    background: transparent;
    color: var(--accent-green);
  }

  .att-btn.attending.selected {
    background: var(--accent-green);
    color: white;
    box-shadow: 0 4px 14px rgba(36, 158, 108, 0.3);
  }

  .att-btn.maybe-btn {
    border: 2px solid var(--warm-gold);
    background: transparent;
    color: #a07600;
  }

  .att-btn.maybe-btn.selected {
    background: var(--warm-gold);
    color: white;
    box-shadow: 0 4px 14px rgba(244, 180, 0, 0.3);
  }

  .att-btn.absent-btn {
    border: 2px solid var(--warm-red);
    background: transparent;
    color: var(--warm-red);
  }

  .att-btn.absent-btn.selected {
    background: var(--warm-red);
    color: white;
    box-shadow: 0 4px 14px rgba(224, 82, 82, 0.3);
  }

  .att-btn:active {
    transform: scale(0.95);
  }

  @keyframes btnBounce {
    0% { transform: scale(0.92); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .att-btn.bounce {
    animation: btnBounce 0.4s var(--ease-spring);
  }

  /* ── Attendees Section ──────────────────────── */
  .attendees-section {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 20px;
  }

  .attendees-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .attendees-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 8px;
    border: none;
    background: none;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-tertiary);
    cursor: pointer;
    transition: color 0.25s var(--ease-smooth);
    -webkit-tap-highlight-color: transparent;
    position: relative;
    letter-spacing: 0.01em;
  }

  .attendees-tab::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 20%; right: 20%;
    height: 2.5px;
    border-radius: 2px;
    background: transparent;
    transition: all 0.3s var(--ease-spring);
  }

  .attendees-tab.active {
    color: var(--text-primary);
    font-weight: 600;
  }

  .attendees-tab.active.tab-going::after { background: var(--accent-green); left: 10%; right: 10%; }
  .attendees-tab.active.tab-maybe::after { background: var(--warm-gold); left: 10%; right: 10%; }
  .attendees-tab.active.tab-absent::after { background: var(--warm-red); left: 10%; right: 10%; }
  .attendees-tab.active.tab-noresponse::after { background: var(--text-tertiary); left: 10%; right: 10%; }

  .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-body);
    transition: all 0.25s var(--ease-smooth);
  }

  .tab-going .tab-count { background: var(--accent-green-bg); color: var(--accent-green); }
  .tab-maybe .tab-count { background: var(--warm-gold-bg); color: #a07600; }
  .tab-absent .tab-count { background: var(--warm-red-bg); color: var(--warm-red); }
  .tab-noresponse .tab-count { background: rgba(138, 149, 165, 0.12); color: var(--text-tertiary); }

  .attendees-content {
    padding: 4px 0;
  }

  .attendees-panel {
    display: none;
    animation: fadeIn 0.25s var(--ease-smooth);
  }

  .attendees-panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .role-group {
    padding: 0 18px;
  }

  .role-group-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    padding: 12px 0 6px;
  }

  .attendee-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .role-group:last-child .attendee-row:last-child,
  .attendee-row:last-child {
    border-bottom: none;
  }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: white;
    flex-shrink: 0;
    font-family: var(--font-body);
    letter-spacing: 0.02em;
  }

  .attendee-info { flex: 1; }

  /* ── Desktop ────────────────────────────────── */

  function getRoleSummary(attendeeIdxs) {
    const roles = {};
    attendeeIdxs.forEach(i => {
      const r = members[i].role;
      roles[r] = (roles[r] || 0) + 1;
    });
    return Object.entries(roles).map(([r, c]) => `${c} ${r}${c > 1 ? 's' : ''}`).join(', ');
  }

  function groupByRole(attendeeIdxs) {
    const groups = {};
    attendeeIdxs.forEach(i => {
      const r = members[i].role;
      if (!groups[r]) groups[r] = [];
      groups[r].push(members[i]);
    });
    return groups;
  }

  // ── Render Events List ────────────────────────
  function renderList() {
    const container = document.getElementById('events-list');
    const filtered = events.filter(e => e.time === activeTime && activeTypes.has(e.type));

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">&#128197;</div>
          <p>No ${activeTime} events match your filters</p>
        </div>`;
      return;
    }

    let html = '';
    let lastSection = '';

    filtered.forEach(event => {
      const section = activeTime === 'upcoming' ? getSectionLabel(event) : getPastSectionLabel(event);
      if (section !== lastSection) {
        html += `<div class="section-heading">${section}</div>`;
        lastSection = section;
      }

      const goingCount = event.attendees.going.length;
      const noResponseCount = (event.attendees.noResponse || []).length;
      const total = goingCount + event.attendees.maybe.length + event.attendees.absent.length + noResponseCount;
      const notRespondedStr = noResponseCount > 0 ? ` &middot; <span style="color:var(--text-tertiary)">${noResponseCount} not responded</span>` : '';

      html += `
        <div class="event-card" data-event-id="${event.id}">

        openDetail(id);
      });

  function getSectionLabel(event) {
    if (event.date.includes('Mar 10') || event.date.includes('Mar 11') || event.date.includes('Mar 12') || event.date.includes('Mar 13') || event.date.includes('Mar 14') || event.date.includes('Mar 15') || event.date.includes('Mar 16')) return 'This Week';

  }

  function getPastSectionLabel(event) {
    if (event.date.includes('Mar')) return 'March';
    return 'February';

          </div>
          <div class="detail-info-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <a class="location-link" href="https://maps.google.com/?q=${event.locationQuery}" target="_blank">${event.location}</a>
          </div>
          ${audienceHtml}
        </div>
      </div>

      <!-- Attendance Actions -->
      <div class="attendance-actions">
        <div class="attendance-actions-label">Your response</div>
        <div class="attendance-btns">
          <button class="att-btn attending ${event.myStatus === 'going' ? 'selected' : ''}" data-status="going">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Attending
          </button>
          <button class="att-btn maybe-btn ${event.myStatus === 'maybe' ? 'selected' : ''}" data-status="maybe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Maybe
          </button>
          <button class="att-btn absent-btn ${event.myStatus === 'absent' ? 'selected' : ''}" data-status="absent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Absent
          </button>
        </div>
      </div>

      <!-- Attendees Section -->
      <div class="attendees-section">
        <div class="attendees-tabs">
          <button class="attendees-tab tab-going active" data-panel="going">
            Attending <span class="tab-count">${event.attendees.going.length}</span>
          </button>
          <button class="attendees-tab tab-maybe" data-panel="maybe">
            Maybe <span class="tab-count">${event.attendees.maybe.length}</span>
          </button>
          <button class="attendees-tab tab-absent" data-panel="absent">
            Absent <span class="tab-count">${event.attendees.absent.length}</span>
          </button>
          <button class="attendees-tab tab-noresponse" data-panel="noresponse">
            ? <span class="tab-count">${noResponseCount}</span>
          </button>
        </div>
        <div class="attendees-content">
          <div class="attendees-panel active" id="panel-going">
            ${renderAttendeesWithEdit(event.attendees.going, event)}
          </div>
          <div class="attendees-panel" id="panel-maybe">
            ${renderAttendeesWithEdit(event.attendees.maybe, event)}
          </div>
          <div class="attendees-panel" id="panel-absent">
            ${renderAttendeesWithEdit(event.attendees.absent, event)}
          </div>
          <div class="attendees-panel" id="panel-noresponse">
            ${renderAttendeesWithEdit(event.attendees.noResponse || [], event)}
          </div>
        </div>
      </div>

      ${event.description ? `
      <!-- Description Section -->
      <div class="description-section">
        <div class="description-heading">Description</div>
        <div class="description-body">${event.description}</div>
      </div>` : ''}

      <!-- Admin Actions -->
      <div class="admin-actions">
        <button class="admin-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit event
        </button>
        <button class="admin-btn delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Delete
        </button>
      </div>
    `;

    // Wire up attendance buttons
    detailContent.querySelectorAll('.att-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const status = btn.dataset.status;
        setAttendance(event, status, btn);
      });
    });

    // Wire up attendee tabs
    detailContent.querySelectorAll('.attendees-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        detailContent.querySelectorAll('.attendees-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        detailContent.querySelectorAll('.attendees-panel').forEach(p => p.classList.remove('active'));
        const panel = document.getElementById('panel-' + tab.dataset.panel);
        panel.classList.add('active');
        // Re-trigger animation
        panel.style.animation = 'none';
        panel.offsetHeight;
        panel.style.animation = '';
      });
    });

    // Wire up edit-attendance dropdowns
    wireEditButtons(detailContent, event);

    // Close dropdowns on outside click
    document.addEventListener('click', closeAllDropdowns, true);

    // Slide in
    document.getElementById('screen-list').classList.add('pushed');
    document.getElementById('screen-detail').classList.add('visible');
    document.getElementById('screen-detail').scrollTop = 0;
  }

  function closeDetail() {
    closeAllDropdowns();
    document.removeEventListener('click', closeAllDropdowns, true);
    document.getElementById('screen-list').classList.remove('pushed');
    document.getElementById('screen-detail').classList.remove('visible');
    currentEventId = null;
    // Re-render list to reflect any attendance changes
    renderList();
  }

  const pencilIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

  function memberRowHtml(m, memberIdx) {
    return `
      <div class="attendee-row" style="position:relative">
        <div class="avatar" style="background: ${m.color};">${m.initials}</div>
        <div class="attendee-info">
          <div class="attendee-name">${m.name}</div>
          <div class="attendee-role">${m.role}</div>
        </div>
        <button class="attendee-edit-btn" data-member-idx="${memberIdx}" title="Change attendance" aria-label="Edit attendance for ${m.name}">
          ${pencilIcon}
        </button>
      </div>`;
  }

  function renderAttendeesWithEdit(attendeeIdxs, event) {
    if (!attendeeIdxs || attendeeIdxs.length === 0) {
      return '<div style="padding: 24px 18px; text-align: center; color: var(--text-tertiary); font-size: 14px;">No one</div>';
    }
    let html = '<div class="role-group">';
    attendeeIdxs.forEach(i => {
      html += memberRowHtml(members[i], i);
    });
    html += '</div>';
    return html;
  }

  // Keep old names as aliases for any remaining references
  function renderAttendeesByRole(attendeeIdxs) { return renderAttendeesWithEdit(attendeeIdxs, null); }
  function renderAttendeesFlat(attendeeIdxs) { return renderAttendeesWithEdit(attendeeIdxs, null); }

  function closeAllDropdowns() {
    document.querySelectorAll('.status-dropdown').forEach(d => d.remove());
  }

  function wireEditButtons(detailContent, event) {
    detailContent.querySelectorAll('.attendee-edit-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        // Close any open dropdowns first
        document.querySelectorAll('.status-dropdown').forEach(d => {
          if (d !== btn.nextElementSibling) d.remove();
        });
        // Toggle: if already open, close
        const existing = btn.parentElement.querySelector('.status-dropdown');
        if (existing) { existing.remove(); return; }

        const memberIdx = parseInt(btn.dataset.memberIdx);
        const dropdown = document.createElement('div');
        dropdown.className = 'status-dropdown';
        dropdown.innerHTML = `
          <button class="status-dropdown-item sdi-going" data-set-status="going"><span class="sdi-dot"></span>Set as Attending</button>
          <button class="status-dropdown-item sdi-maybe" data-set-status="maybe"><span class="sdi-dot"></span>Set as Maybe</button>
          <button class="status-dropdown-item sdi-absent" data-set-status="absent"><span class="sdi-dot"></span>Set as Absent</button>
          <button class="status-dropdown-item sdi-noresponse" data-set-status="noresponse"><span class="sdi-dot"></span>Clear response</button>
        `;
        btn.parentElement.appendChild(dropdown);

        dropdown.querySelectorAll('.status-dropdown-item').forEach(item => {
          item.addEventListener('click', e2 => {
            e2.stopPropagation();
            const newStatus = item.dataset.setStatus;
            dropdown.remove();
            setMemberAttendance(event, memberIdx, newStatus);
          });
        });
      });
    });
  }

  function setAttendance(event, status, btnEl) {
    // Remove user (index 1 = Julius van Dis) from all lists
    const userId = 1;
    event.attendees.going = event.attendees.going.filter(i => i !== userId);
    event.attendees.maybe = event.attendees.maybe.filter(i => i !== userId);
    event.attendees.absent = event.attendees.absent.filter(i => i !== userId);
    if (!event.attendees.noResponse) event.attendees.noResponse = [];
    event.attendees.noResponse = event.attendees.noResponse.filter(i => i !== userId);

    // Add to the selected list
    if (status === 'going') {
      event.attendees.going.push(userId);
      event.myStatus = 'going';
    } else if (status === 'maybe') {
      event.attendees.maybe.push(userId);
      event.myStatus = 'maybe';
    } else {
      event.attendees.absent.push(userId);
      event.myStatus = 'absent';
    }

    // Update button states
    const container = btnEl.closest('.attendance-btns');
    container.querySelectorAll('.att-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');

    // Bounce animation
    btnEl.classList.remove('bounce');
    btnEl.offsetHeight;
    btnEl.classList.add('bounce');

    refreshAttendeePanels(event);
  }

  function setMemberAttendance(event, memberIdx, newStatus) {
    if (!event.attendees.noResponse) event.attendees.noResponse = [];
    // Remove from all lists
    event.attendees.going = event.attendees.going.filter(i => i !== memberIdx);
    event.attendees.maybe = event.attendees.maybe.filter(i => i !== memberIdx);
    event.attendees.absent = event.attendees.absent.filter(i => i !== memberIdx);
    event.attendees.noResponse = event.attendees.noResponse.filter(i => i !== memberIdx);
    // Add to new list
    if (newStatus === 'going') event.attendees.going.push(memberIdx);
    else if (newStatus === 'maybe') event.attendees.maybe.push(memberIdx);
    else if (newStatus === 'absent') event.attendees.absent.push(memberIdx);
    else event.attendees.noResponse.push(memberIdx);

    refreshAttendeePanels(event);
  }

  function refreshAttendeePanels(event) {
    const detailContent = document.getElementById('detail-content');
    if (!detailContent) return;

    // Update tab counts
    const section = detailContent.querySelector('.attendees-section');
    if (!section) return;
    section.querySelector('.tab-going .tab-count').textContent = event.attendees.going.length;
    section.querySelector('.tab-maybe .tab-count').textContent = event.attendees.maybe.length;
    section.querySelector('.tab-absent .tab-count').textContent = event.attendees.absent.length;
    section.querySelector('.tab-noresponse .tab-count').textContent = (event.attendees.noResponse || []).length;

    // Re-render panels
    document.getElementById('panel-going').innerHTML = renderAttendeesWithEdit(event.attendees.going, event);
    document.getElementById('panel-maybe').innerHTML = renderAttendeesWithEdit(event.attendees.maybe, event);
    document.getElementById('panel-absent').innerHTML = renderAttendeesWithEdit(event.attendees.absent, event);
    document.getElementById('panel-noresponse').innerHTML = renderAttendeesWithEdit(event.attendees.noResponse || [], event);

    // Re-wire edit buttons in the freshly rendered panels
    wireEditButtons(detailContent, event);
  }

  // ── Filter Interactions ───────────────────────
  document.querySelectorAll('.time-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.time-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTime = btn.dataset.time;
      renderList();
    });
  });

  document.querySelectorAll('.type-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const type = pill.dataset.type;
      if (activeTypes.has(type)) {
        // Don't allow deselecting all
        if (activeTypes.size <= 1) return;
        activeTypes.delete(type);
        pill.classList.remove('active');
      } else {
        activeTypes.add(type);
        pill.classList.add('active');
      }
      renderList();
    });
  });

  // ── Back Button ───────────────────────────────
  document.getElementById('btn-back').addEventListener('click', closeDetail);

  // ── Init ──────────────────────────────────────
  renderList();
</script>

</body>
</html>
