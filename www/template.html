<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="alternate" hreflang="nl" href="https://teambalance.nl/" />
    <link rel="alternate" hreflang="en" href="https://teambalance.nl/en/" />
    <link rel="alternate" hreflang="x-default" href="https://teambalance.nl/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Grandstander:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/design-tokens/tokens.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav class="lang-switch">
      <a href="{{otherHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}">{{otherName}}</a>
    </nav>
    <main class="hero">
      <h1 class="wordmark">Team<span class="green">Balance</span></h1>
      <p class="tagline">{{tagline}}</p>
      <a href="https://app.teambalance.nl" class="cta">{{cta}}</a>
    </main>
  </body>
</html>
