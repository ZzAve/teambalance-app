<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="alternate" hreflang="nl" href="https://teambalance.nl/" />
    <link rel="alternate" hreflang="en" href="https://teambalance.nl/en/" />
    <link rel="alternate" hreflang="x-default" href="https://teambalance.nl/" />
    <meta name="description" content="{{metaDescription}}" />
    <link rel="canonical" href="{{metaUrl}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TeamBalance" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{metaDescription}}" />
    <meta property="og:url" content="{{metaUrl}}" />
    <meta property="og:locale" content="{{metaOgLocale}}" />
    <meta property="og:image" content="https://teambalance.nl/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{metaImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/tb-monogram.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/fonts/grandstander-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/design-tokens/tokens.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav class="lang-switch">
      <a href="{{otherHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}">{{otherName}}</a>
    </nav>
    <main class="hero">
      <h1 class="wordmark">Team<span class="green">Balance</span></h1>
      <p class="tagline">{{tagline}}</p>
      <a href="https://app.teambalance.nl" class="cta">{{cta}}</a>
    </main>
  </body>
</html>
